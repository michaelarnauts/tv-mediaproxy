name: Build

# One compile: a static (musl) Linux x86-64 binary. The Docker image wraps it
# and a v* tag also attaches it to a GitHub release.

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  binary:
    name: Binary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Installs the toolchain and musl target from rust-toolchain.toml and
      # caches ~/.cargo and target/. No RUSTFLAGS: clippy checks lints.
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          rustflags: ""

      - name: Install musl tools
        run: sudo apt-get install -y musl-tools

      - name: Build
        run: cargo build --release --target x86_64-unknown-linux-musl

      - uses: actions/upload-artifact@v4
        with:
          name: tv-mediaproxy
          path: target/x86_64-unknown-linux-musl/release/tv-mediaproxy
          if-no-files-found: error

  image:
    name: Docker image
    needs: binary
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v4
        with:
          name: tv-mediaproxy
          path: dist

      - name: Make the binary executable
        run: chmod +x dist/tv-mediaproxy

      # Needed for the arm64 build below.
      # - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=sha

      # amd64 only: the binary is built for x86-64. For arm64, build an
      # aarch64 binary too and enable QEMU above and the platforms line.
      - uses: docker/build-push-action@v6
        with:
          context: .
          # platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  release:
    name: GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: binary
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v4
        with:
          name: tv-mediaproxy
          path: dist

      - name: Package
        run: |
          name=tv-mediaproxy-${GITHUB_REF_NAME}-x86_64-linux
          mkdir "$name"
          install -m 755 dist/tv-mediaproxy "$name"/
          cp README.md LICENSE config-example.toml "$name"/
          tar czf "$name.tar.gz" "$name"
          sha256sum "$name.tar.gz" > "$name.tar.gz.sha256"

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            tv-mediaproxy-*.tar.gz
            tv-mediaproxy-*.tar.gz.sha256
          generate_release_notes: true
