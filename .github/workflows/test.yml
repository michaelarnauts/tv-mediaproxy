name: Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  CARGO_TERM_COLOR: always

jobs:
  lint-and-test:
    name: Lint & test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      # Installs the toolchain from rust-toolchain.toml and caches ~/.cargo
      # and target/ (Swatinem/rust-cache). No RUSTFLAGS: clippy checks lints.
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          rustflags: ""

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run clippy
        run: cargo clippy --all-targets -- -D warnings

      # Debug profile: the release profile's fat LTO only slows tests down.
      # One thread: config tests mutate global env vars.
      - name: Run tests
        run: cargo test -- --test-threads=1

      - name: Install cargo-machete
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-machete

      - name: Audit unused dependencies
        run: cargo machete
