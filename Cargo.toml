[package]
name = "tv-mediaproxy"
version = "0.2.4"
edition = "2021"

[dependencies]
actix-web = "4.13"
tokio = { version = "1.51", features = ["full"] }
serde_json = "1.0"
futures = "0.3"
bytes = "1.11"
reqwest = { version = "0.12.28", default-features = false, features = ["rustls-tls-webpki-roots", "gzip"] }
aes = "0.8"
cbc = "0.1"
ctr = "0.9"
base64 = "0.22.1"
hex = "0.4"
url = "2.5"
urlencoding = "2.1"
thiserror = "2.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
regex = "1.12"
quick-xml = "0.37"
flate2 = "1"
moka = { version = "0.12", features = ["future"] }
dash-mpd-core = { version = "0.1.0", default-features = false, features = ["log"] }
