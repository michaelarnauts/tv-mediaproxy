[package]
name = "tv-mediaproxy"
version = "1.0.0"
edition = "2021"

[features]
default = ["tls-rustls"]
# TLS backend for `reqwest` (exactly one).
tls-native = ["reqwest/native-tls"]
tls-rustls = ["reqwest/rustls-tls-webpki-roots"]

# ---------------------------------------------------------------------------
# Release profile — maximise performance
# ---------------------------------------------------------------------------

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
debug = false

[dependencies]
actix-web = "4.13"
actix-cors = "0.7"
tokio = { version = "1.51", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
futures = "0.3"
bytes = "1.11"
reqwest = { version = "0.12.28", default-features = false, features = ["stream", "json", "socks", "gzip", "deflate"] }

# Crypto — AES-CTR/CBC for CENC
aes = "0.8"
cbc = { version = "0.1", features = ["alloc"] }
ctr = "0.9"
base64 = "0.22.1"
hex = "0.4"

url = "2.5"
urlencoding = "2.1"
thiserror = "2.0"
config = "0.15"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dashmap = "6"
regex = "1.12"
quick-xml = "0.37"
moka = { version = "0.12", features = ["future"] }
chrono = { version = "0.4", default-features = false, features = ["std"] }
dash-mpd-core = { version = "0.1.0", default-features = false, features = ["log"] }

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
tempfile = "3.27"
